<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — Project Management Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen bg-slate-50 flex flex-col items-center justify-center px-4 py-12">
  <div class="w-full max-w-md">
    <a href="index.html" class="inline-block text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent mb-8">PM Tool</a>
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
      <h1 class="text-2xl font-bold text-slate-900">Log in</h1>
      <p class="mt-1 text-slate-600">Enter your credentials to access your account.</p>
      <form class="mt-8 space-y-5" action="dashboard.html" method="get">
        <div>
          <label for="email" class="block text-sm font-medium text-slate-700">Email</label>
          <input type="email" id="email" name="email" required
            class="mt-1.5 w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
            placeholder="you@example.com">
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700">Password</label>
          <input type="password" id="password" name="password" required
            class="mt-1.5 w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
            placeholder="••••••••">
        </div>
        <button type="submit" class="w-full py-3 rounded-lg bg-indigo-600 text-white font-semibold hover:bg-indigo-700 transition-colors shadow-sm">
          Log in
        </button>
      </form>
      <p class="mt-6 text-center text-sm text-slate-600">
        Don't have an account?
        <a href="register.html" class="font-medium text-indigo-600 hover:text-indigo-700">Sign up</a>
      </p>
    </div>
    <p class="mt-6 text-center">
      <a href="index.html" class="text-sm text-slate-500 hover:text-slate-700">← Back to home</a>
    </p>
  </div>
</body>
</html>
